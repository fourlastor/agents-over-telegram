name: Release

# Pushing a vX.Y.Z tag publishes that version. Claude Code and Codex install
# from this repository's marketplace files, so the tag is their release too.
# npm uses trusted publishing (OIDC): the repository holds no npm token. See
# docs/RELEASING.md for the one-time setup.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every version file matches the tag
        run: python3 scripts/release_check.py "$GITHUB_REF_NAME"

  npm:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm supports trusted publishing
        # OIDC publishing needs npm 11.5.1 or newer.
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing; 11.5.1 or newer is needed`);
              process.exit(1);
            }' "$(npm --version)"

      - name: Publish with provenance
        run: npm publish

  github:
    name: Create the GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
