name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the declared minimum; 3.13 is the tested development version.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Run the test suite
        run: |
          python=.venv/bin/python; [ -x "$python" ] || python=.venv/Scripts/python.exe
          if [ "$RUNNER_OS" = Windows ]; then
            # Stop before the job limit so the log survives, and dump the stack
            # of any test that runs for more than two minutes.
            timeout 900 "$python" -m pytest -v -o faulthandler_timeout=120
          else
            "$python" -m pytest -q
          fi

      - name: Validate the plugin package
        run: |
          python=.venv/bin/python; [ -x "$python" ] || python=.venv/Scripts/python.exe
          "$python" scripts/validate_package.py

      - name: Run the offline demo
        run: .venv/bin/aot demo
