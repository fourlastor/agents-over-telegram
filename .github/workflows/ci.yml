name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.shard && format(', {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.11 is the declared minimum; 3.13 is the tested development version.
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
          # Windows runs in shards by test file name while it is brought up,
          # so one shard that loses its runner does not hide the others' logs.
          - os: windows-latest
            python: "3.13"
            shard: "[a-c]"
          - os: windows-latest
            python: "3.13"
            shard: "[d-g]"
          - os: windows-latest
            python: "3.13"
            shard: "[h-m]"
          - os: windows-latest
            python: "3.13"
            shard: "[n-r]"
          - os: windows-latest
            python: "3.13"
            shard: "[s-z]"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Run the test suite
        # A step that runs out of time fails the job but keeps its log;
        # a job that runs out of time is cancelled and its log is lost.
        timeout-minutes: 20
        run: |
          python=.venv/bin/python; [ -x "$python" ] || python=.venv/Scripts/python.exe
          if [ "$RUNNER_OS" = Windows ]; then
            # A test that hangs for two minutes dumps every thread and exits,
            # so the log survives instead of running into the job limit.
            # Collect only this shard's files; conftest still skips the ones Windows does not support.
            AOT_TEST_HANG_SECONDS=120 "$python" -m pytest -v tests -o 'python_files=test_${{ matrix.shard }}*.py'
          else
            "$python" -m pytest -q
          fi

      - name: Validate the plugin package
        run: |
          python=.venv/bin/python; [ -x "$python" ] || python=.venv/Scripts/python.exe
          "$python" scripts/validate_package.py

      - name: Run the offline demo
        run: .venv/bin/aot demo
