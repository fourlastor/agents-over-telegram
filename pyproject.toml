[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "agents-over-telegram"
version = "0.7.2"
description = "One human-owned Telegram bot, multiple isolated logical agent conversations"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["mcp==1.30.0", "jsonschema==4.26.0", "anyio==4.15.1", "websockets==15.0.1"]

[project.urls]
Homepage = "https://github.com/fourlastor/agents-over-telegram"
Repository = "https://github.com/fourlastor/agents-over-telegram"
Issues = "https://github.com/fourlastor/agents-over-telegram/issues"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.4.0", "jsonschema==4.26.0", "PyYAML==6.0.3"]

[dependency-groups]
bootstrap-build = ["hatchling==1.27.0"]

[project.scripts]
aot = "agents_over_telegram.cli:main"
aot-codex-bridge = "agents_over_telegram.desktop_bridge:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_over_telegram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "skills/", "scripts/", "docs/", "requirements/runtime.txt", "requirements/build.txt", "plugin.json", ".codex-plugin/", ".agents/plugins/marketplace.json", "pyproject.toml", "uv.lock", "README.md", "PROPOSAL.md", "HANDOFF.md", "LICENSE"]
